<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Searching PDQ hashes with a float vector store: approximate KNN for candidates, then exact Hamming distance</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6570"/>
    </marker>
  </defs>
  <rect width="760" height="530" rx="12" fill="#fdfcfa"/>

  <!-- 1 image -->
  <rect x="40" y="30" width="300" height="76" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
  <text x="58" y="58" font-size="15" font-weight="700" fill="#1d1f23">1. Hash the image</text>
  <text x="58" y="82" font-size="13" fill="#5f6570">PDQ gives 256 bits (64 hex chars)</text>

  <!-- 2 project -->
  <rect x="420" y="30" width="300" height="76" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
  <text x="438" y="58" font-size="15" font-weight="700" fill="#1d1f23">2. Split into chunks</text>
  <text x="438" y="82" font-size="13" fill="#5f6570">Each chunk becomes one float</text>

  <!-- 3 vector store -->
  <rect x="420" y="150" width="300" height="150" rx="8" fill="#eef4fb" stroke="#1f5fae" stroke-dasharray="6 4"/>
  <text x="438" y="176" font-size="15" font-weight="700" fill="#1d1f23">3. Approximate KNN</text>
  <text x="438" y="196" font-size="12" fill="#1f5fae">A float vector store</text>
  <text x="438" y="226" font-size="13" fill="#5f6570">Fast and cheap, but a bit dim:</text>
  <text x="438" y="246" font-size="13" fill="#5f6570">a flipped high bit moves the float</text>
  <text x="438" y="266" font-size="13" fill="#5f6570">far more than a flipped low bit</text>
  <text x="438" y="286" font-size="13" fill="#1d1f23">Output: a shortlist of candidates</text>

  <!-- 4 hamming -->
  <rect x="40" y="150" width="300" height="150" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
  <text x="58" y="176" font-size="15" font-weight="700" fill="#1d1f23">4. Exact Hamming re-rank</text>
  <text x="58" y="206" font-size="13" fill="#5f6570">Count the differing bits between</text>
  <text x="58" y="226" font-size="13" fill="#5f6570">the query and each candidate.</text>
  <text x="58" y="256" font-size="13" fill="#5f6570">Cheap, because the shortlist</text>
  <text x="58" y="276" font-size="13" fill="#5f6570">is small</text>

  <!-- outcomes -->
  <rect x="40" y="350" width="300" height="76" rx="8" fill="#e5f4e4" stroke="#3d8b3d"/>
  <text x="58" y="378" font-size="15" font-weight="700" fill="#1d1f23">Match</text>
  <text x="58" y="402" font-size="13" fill="#5f6570">Distance under your threshold</text>
  <rect x="420" y="350" width="300" height="76" rx="8" fill="#f4f3f0" stroke="#c9c6bf"/>
  <text x="438" y="378" font-size="15" font-weight="700" fill="#1d1f23">No match</text>
  <text x="438" y="402" font-size="13" fill="#5f6570">Everything else is dropped</text>

  <!-- footnote -->
  <text x="40" y="478" font-size="13" fill="#1d1f23">No HNSW graph held in RAM, and no full scan computing Hamming against every row.</text>
  <text x="40" y="500" font-size="13" fill="#5f6570">The float step finds the neighbourhood; the bit step decides who actually lives there.</text>

  <!-- arrows -->
  <line x1="340" y1="68" x2="416" y2="68" stroke="#5f6570" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="106" x2="570" y2="146" stroke="#5f6570" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="225" x2="344" y2="225" stroke="#5f6570" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="215" font-size="12" fill="#5f6570">candidates</text>
  <line x1="190" y1="300" x2="190" y2="346" stroke="#5f6570" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M340,265 C380,265 380,388 416,388" fill="none" stroke="#5f6570" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
