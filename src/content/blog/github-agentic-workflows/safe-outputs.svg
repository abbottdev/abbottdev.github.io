<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How GitHub Agentic Workflows keeps the agent's outputs safe</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6570"/>
    </marker>
  </defs>
  <rect width="760" height="520" rx="12" fill="#fdfcfa"/>

  <!-- 1 prompt -->
  <rect x="40" y="30" width="300" height="76" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
  <text x="58" y="58" font-size="15" font-weight="700" fill="#1d1f23">1. Build the prompt</text>
  <text x="58" y="82" font-size="13" fill="#5f6570">A separate action generates the prompt</text>

  <!-- 2 agent container -->
  <rect x="40" y="140" width="300" height="200" rx="8" fill="#eef4fb" stroke="#1f5fae" stroke-dasharray="6 4"/>
  <text x="58" y="166" font-size="15" font-weight="700" fill="#1d1f23">2. Run the agent</text>
  <text x="58" y="186" font-size="12" fill="#1f5fae">Firewalled Docker container</text>
  <rect x="60" y="202" width="260" height="50" rx="6" fill="#ffffff" stroke="#c9c6bf"/>
  <text x="76" y="224" font-size="13" font-weight="600" fill="#1d1f23">Agent CLI (pluggable)</text>
  <text x="76" y="242" font-size="12" fill="#5f6570">Uses MCP functions to "apply" outcomes</text>
  <rect x="60" y="264" width="260" height="64" rx="6" fill="#ffffff" stroke="#c9c6bf"/>
  <text x="76" y="284" font-size="13" font-weight="600" fill="#1d1f23">Queued, not applied</text>
  <text x="76" y="302" font-size="12" fill="#5f6570">Comments, changes and network</text>
  <text x="76" y="318" font-size="12" fill="#5f6570">requests are all recorded</text>

  <!-- 3 threat detection -->
  <rect x="420" y="140" width="300" height="200" rx="8" fill="#ffffff" stroke="#c9c6bf"/>
  <text x="438" y="166" font-size="15" font-weight="700" fill="#1d1f23">3. Threat detection</text>
  <text x="438" y="190" font-size="13" fill="#5f6570">A separate agent and prompt,</text>
  <text x="438" y="208" font-size="13" fill="#5f6570">unconnected to the original task,</text>
  <text x="438" y="226" font-size="13" fill="#5f6570">scans:</text>
  <text x="452" y="252" font-size="13" fill="#1d1f23">• the prompt</text>
  <text x="452" y="272" font-size="13" fill="#1d1f23">• the network requests</text>
  <text x="452" y="292" font-size="13" fill="#1d1f23">• the conversation</text>
  <text x="452" y="312" font-size="13" fill="#1d1f23">• the queued safe outputs</text>

  <!-- 4 outcomes -->
  <rect x="420" y="390" width="300" height="76" rx="8" fill="#e5f4e4" stroke="#3d8b3d"/>
  <text x="438" y="418" font-size="15" font-weight="700" fill="#1d1f23">4. Apply the safe outputs</text>
  <text x="438" y="442" font-size="13" fill="#5f6570">Deferred actions run only on a pass</text>
  <rect x="40" y="390" width="300" height="76" rx="8" fill="#fbebeb" stroke="#b44a4a"/>
  <text x="58" y="418" font-size="15" font-weight="700" fill="#1d1f23">Blocked</text>
  <text x="58" y="442" font-size="13" fill="#5f6570">Nothing reaches the repository</text>

  <!-- arrows -->
  <line x1="190" y1="106" x2="190" y2="136" stroke="#5f6570" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="240" x2="416" y2="240" stroke="#5f6570" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="230" font-size="12" fill="#5f6570">recorded</text>
  <line x1="570" y1="340" x2="570" y2="386" stroke="#3d8b3d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="368" font-size="12" font-weight="600" fill="#3d8b3d">pass</text>
  <path d="M500,340 L500,365 L190,365 L190,386" fill="none" stroke="#b44a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="358" font-size="12" font-weight="600" fill="#b44a4a">fail</text>

  <text x="40" y="500" font-size="12" fill="#5f6570">The agent that does the work never writes to the repository itself.</text>
</svg>
